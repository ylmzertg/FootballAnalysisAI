project:
  name: FootballAnalysisAI
  profile: best_quality

paths:
  input_dir: input
  output_dir: output
  models_dir: models

engines:
  calibration:
    primary: pnlcalib
    fallback: tvcalib
    coordinate_system: top_left_origin_x_0_105_y_0_68_m

  detection:
    default: yolo

  tracking:
    default: bytetrack

  team_classification:
    default: v2.4
    canonical_identity: true

runtime:
  preferred_device: auto
  cpu_fallback: true

benchmark:
  weights:
    quality: 0.50
    robustness: 0.20
    speed: 0.15
    integration: 0.10
    license: 0.05
